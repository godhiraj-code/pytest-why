[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-why"
version = "0.1.2"
description = "Pytest plugin that explains why tests failed, in plain English, with next steps and a shareable report."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Dhiraj Das" }
]
keywords = [
  "pytest",
  "pytest-plugin",
  "test-failures",
  "debugging",
  "assertion",
  "traceback",
  "flaky-tests",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Quality Assurance",
  "Operating System :: OS Independent",
]
dependencies = [
  "pytest>=7",
]

[project.urls]
Homepage = "https://www.dhirajdas.dev/project/pytest-why"
Documentation = "https://github.com/godhiraj-code/pytest-why#readme"
Repository = "https://github.com/godhiraj-code/pytest-why"
Issues = "https://github.com/godhiraj-code/pytest-why/issues"
Blog = "https://www.dhirajdas.dev/blog/pytest-why-actionable-failure-guidance"

[project.optional-dependencies]
dev = [
  "build",
  "pytest>=7",
]

[project.entry-points.pytest11]
why = "pytest_why.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
